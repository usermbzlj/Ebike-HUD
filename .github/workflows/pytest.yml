name: rpar
on:
  push:
  pull_request:
jobs:
  pytest:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -e .
          python -m pip install pytest
      - name: Test
        run: python -m pytest tests -q
        env:
          PYTHONPATH: python/src
